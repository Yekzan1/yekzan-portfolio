services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: yekzan-portfolio
    container_name: yekzan-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Optional — enables the Claude-powered assistant. Without it, a free
      # offline responder answers from the built-in knowledge base.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
